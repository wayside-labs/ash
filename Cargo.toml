[workspace]
resolver = "2"
members = [
    "crates/agent-rails-policy",
    "programs/agent_rails",
    "programs/test_pda_relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/0xcf02/agent-rails"

[workspace.dependencies]
anchor-lang = "=1.1.2"
# Pinned to `anchor-lang` exactly: the two crates share the Anchor derive machinery, and a
# mismatched pair fails to compile in ways that point at the wrong file.
anchor-spl = { version = "=1.1.2", default-features = false, features = [
    "token",
    "token_2022",
    "associated_token",
] }
# `version` alongside `path` is what a publish would require, and is what keeps the
# dependency from reading as a wildcard.
agent-rails-policy = { path = "crates/agent-rails-policy", version = "0.1.0", default-features = false }

# `overflow-checks` is mandatory: the policy crate uses `checked_*` everywhere, but the
# Anchor layer must also trap rather than wrap on any arithmetic we missed.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

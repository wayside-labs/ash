[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
agent_rails = "4qjD6vSgYa3oBKde3KVzsH8oCcP9BKsirX1xtD5SS6BS"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# The Rust test pyramid (ADR-008) is the source of truth; `anchor test` only wires up
# layers 1 and 2, which need no validator.
test = "cargo test --workspace"

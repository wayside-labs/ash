[package]
name = "agent-rails-policy"
description = "Pure spend-policy arithmetic and audit hash chain for the agent_rails program"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std", "hash"]
std = []
# Bundles a software SHA-256 so off-chain consumers get `genesis_audit_head` /
# `next_audit_head` directly. The on-chain program keeps this feature off and feeds
# `audit_preimage` to the `sol_sha256` syscall instead, which is far cheaper in CU.
hash = ["dep:sha2"]

[dependencies]
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"

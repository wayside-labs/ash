name: UI

# Layer 4 of the ADR-008 pyramid, for the dashboard: a browser against a real Next server.
#
# The layer below it — `vitest` in `packages/dashboard/src` — reaches route handlers and
# pure helpers, and reaches no page: the screens are assembled from providers, hooks and
# Radix primitives that only exist once something renders them. A page that throws on mount,
# a switch that never writes back, a deposit dialog that builds the wrong request body and a
# secret that leaks into a JSON response are all green under a unit suite.
#
# Neither a cluster nor a validator is involved. `e2e/fixtures.ts` fulfils every
# `/api/solana/*` call inside the browser and `ASH_HOME` repoints the JSON store, so
# this job is deterministic and offline. The chain's own behaviour is layer 5's job.
#
# On pull requests that touch the dashboard, plus nightly, so a change to a shared package
# that breaks a page is caught within a day rather than at the next dashboard PR.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/dashboard/**"
      - "packages/sdk/**"
      - "packages/contract/**"
      - ".github/workflows/ui.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: dashboard ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Keyed by the resolved Playwright version: a browser build is pinned to the release
      # that downloads it, so a cache hit under a different version is a wrong hit.
      - id: pw
        run: |
          version=$(pnpm --filter @ash/dashboard exec playwright --version | awk '{print $2}')
          test -n "$version" || { echo "could not resolve the playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @ash/dashboard exec playwright install --with-deps chromium

      # System libraries are not in the browser cache, so they are installed even on a hit.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @ash/dashboard exec playwright install-deps chromium

      # VERIFY_STRICT turns the script's loud skip into a failure, for the reason spelled
      # out at the top of scripts/verify.sh: a gate that reports success because its tool is
      # missing is worse than no gate.
      - run: scripts/verify.sh ui
        env:
          VERIFY_STRICT: 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: packages/dashboard/.playwright/results
          retention-days: 7

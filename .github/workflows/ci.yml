name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing, and on a private repo it also burns metered minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit SHA, not a tag: a tag is mutable, and these run
# with access to a repository that custodies program upgrade authority (ADR-011).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain action: rust-toolchain.toml pins the channel and names rustfmt and
      # clippy as components, so rustup installs them on the first cargo invocation.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The policy crate uses checked_* everywhere, but the Anchor layer relies on this
      # to trap rather than wrap on the arithmetic it does not cover. Silent if removed,
      # so it is asserted rather than remembered.
      - name: overflow-checks is still on for release builds
        run: grep -qE '^overflow-checks = true$' Cargo.toml
      # Layers 1 and 2 of the ADR-008 pyramid; anchor-litesvm needs no validator, so
      # this covers the policy proptests and every instruction's integration tests.
      - run: cargo test --workspace

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Regenerates the client from the committed IDL and fails on any difference.
      # This is the enforcement behind "never hand-edit packages/client/src/generated":
      # deterministic, and not something a local hook can be talked out of.
      - run: pnpm codegen:check
      - run: pnpm audit --prod --audit-level high

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # RustSec advisories, license policy, and source registry, per deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0
      # .gitignore already refuses `**/*keypair*.json`; this is the check for a secret
      # that reached a commit under some other name.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: sast
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.1@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rule sets are named explicitly rather than `--config auto`: a scan whose
      # findings change when the registry changes is one nobody trusts.
      - run: semgrep scan --config p/typescript --config p/rust --error --metrics=off

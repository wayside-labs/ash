name: Kani

# Bounded model checking of crates/ash-policy (ADR-008 layer 1, ADR-015).
#
# Separate from CI, and deliberately NOT a required status check. ADR-008 scoped Kani as
# non-blocking, and idl.yml already recorded what happens when a path-filtered job is
# required: it never reports, and the pull request stays unmergeable rather than going
# green. Path-filtered and advisory is the combination that is safe to run this way.
#
# The filter is the whole reason this is affordable per pull request rather than only
# nightly as ADR-008 assumed. Measured on the runner: 1m14s end to end, 31s of it installing
# Kani and 38s of solver for thirteen harnesses. The policy crate changes rarely, so most
# pull requests skip this entirely — and the ones that do not are exactly the ones where a
# red run is worth reading, because a broken proof points at the arithmetic the change just
# touched instead of at a nightly nobody opens.
on:
  push:
    branches: [main]
    paths:
      - "crates/ash-policy/**"
      - "scripts/verify.sh"
      - ".github/workflows/kani.yml"
  pull_request:
    # Spelled out rather than shared with an anchor: GitHub's workflow parser does not
    # resolve YAML aliases, and it drops them quietly rather than erroring.
    paths:
      - "crates/ash-policy/**"
      - "scripts/verify.sh"
      - ".github/workflows/kani.yml"
  # ADR-008's nightly, kept: a proof can start failing without the crate changing, when a
  # Kani release changes what its solver can discharge.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  proofs:
    name: policy proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read out of scripts/verify.sh rather than declared here, for the reason ci.yml
      # reads AGAVE_VERSION out of idl.yml: the script is what runs the proofs, so the
      # version it expects is the version that matters, and two copies drift apart.
      - id: versions
        run: |
          kani=$(sed -n 's/^KANI_VERSION=\(.*\)$/\1/p' scripts/verify.sh)
          test -n "$kani" || { echo "KANI_VERSION missing from scripts/verify.sh"; exit 1; }
          echo "kani=$kani" >> "$GITHUB_OUTPUT"

      # Deliberately uncached, which is the opposite of what the rest of this repository
      # does and needs the reason on the record. Kani is three installs: the cargo plugin,
      # the release bundle carrying CBMC (485 MB), and the nightly rustc that bundle is
      # built against (1.5 GB). All three together take 31s here. Caching the two big ones
      # would spend 2 GB of a 10 GB repository-wide Actions cache budget to save that 31s —
      # enough to evict the rust-cache entries the `rust` job in ci.yml depends on, making
      # the critical path slower in order to make this job faster.
      - run: |
          cargo install --locked kani-verifier --version "${{ steps.versions.outputs.kani }}"
          cargo-kani setup

      # Delegated to the script for the same reason every other gate is: there is one list
      # of checks, not a local one and a CI one. `verify.sh kani` skips loudly rather than
      # passing when cargo-kani is absent, so a broken install here fails visibly instead
      # of reporting a green run that verified nothing.
      - run: scripts/verify.sh kani
        env:
          # A skipped check is not a passed check; see scripts/verify.sh.
          VERIFY_STRICT: 1

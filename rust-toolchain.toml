# Pinned exactly, not to a channel: ADR-011 commits to a verifiable build hash, and a
# floating toolchain makes the program bytes depend on when CI happened to run.
# `components` is what lets CI skip a toolchain action — rustup installs them on the
# first cargo invocation.
[toolchain]
channel = "1.97.1"
# `llvm-tools` is here for cargo-llvm-cov, which instruments with the toolchain's own
# LLVM: a mismatched profdata format from a system llvm-profdata fails to merge.
components = ["rustfmt", "clippy", "llvm-tools"]
profile = "minimal"
